*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.gbar{display:block;height:8px;background:#12233a;border-radius:4px;overflow:hidden}.gbar i{display:block;height:100%}.ct{width:100%;border-collapse:collapse;font-size:13px;font-family:ui-monospace,Menlo,monospace}.ct td,.ct th{padding:3px 4px;border-bottom:1px solid #16304a;text-align:left}.ct th{color:#7fd0ff;font-weight:600}
.ml{list-style:none;margin:0;padding:0}.mi{display:flex;gap:8px;padding:7px 4px;border-bottom:1px solid #16304a;font-size:13px;line-height:1.35}.mi img,.mi .pt{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center}.mi>div{min-width:0;flex:1}.mi.done,.mi.failed{opacity:.6}.nx{color:#ffd36b}.nb{margin-left:6px;font-size:10px;background:#ff5d8f;color:#fff;border-radius:6px;padding:1px 5px}.nb.up{background:#4fa3ff}.mi .mapgo{margin-top:4px;max-width:none}
.sb{position:relative}.sbb{position:absolute;top:2px;right:4px;font-style:normal;font-size:10px;background:#ff5d8f;color:#fff;border-radius:8px;padding:0 5px}
.sb{font-size:12px;gap:3px}.sb i{font-style:normal}
.mtip{border:1px solid #2f6b5a;background:#0c2a24;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0 10px}
